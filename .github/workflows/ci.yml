name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bindings:
    name: Gerbil v0.19 bindings (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      GERBIL_RELEASE_ROOT: ${{ github.workspace }}/.ci/gerbil-v0.19
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy,rustfmt

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential jq

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: |
          brew list --formula ghostscript >/dev/null 2>&1 && brew unlink ghostscript || true
          brew install gcc jq

      - name: Download immutable Gerbil v0.19 release artifact
        shell: bash
        run: tools/ci/install-gerbil-release.sh "$GERBIL_RELEASE_ROOT"

      - name: Activate Gerbil build controls
        shell: bash
        run: |
          test -x "$GERBIL_PREFIX/bin/gsc"
          cores="$(getconf _NPROCESSORS_ONLN 2>/dev/null || sysctl -n hw.ncpu)"
          {
            echo "GERBIL_GSC=$GERBIL_PREFIX/bin/gsc"
            echo "GERBIL_BUILD_CORES=$cores"
          } >> "$GITHUB_ENV"
          "$GERBIL_PREFIX/bin/gsc" -v

      - name: Configure Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          cache-save: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
          disk-cache: gerbil-v0.19-${{ runner.os }}-${{ runner.arch }}
          repository-cache: true

      - name: Cargo format
        run: cargo fmt --all --check

      - name: Cargo gates
        run: |
          cargo check --workspace --locked
          cargo test --workspace --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Bazel gates
        run: |
          bazel query //...
          bazel build //...
          bazel test //:ci
