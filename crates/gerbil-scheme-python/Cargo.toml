[package]
name = "gerbil-scheme-python"
description = "Reusable Python embedding and relocatable resources for Gerbil libraries"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = []
owned-values = ["dep:num-bigint"]
c-abi = ["owned-values"]
python = ["dep:pyo3", "owned-values", "pyo3/num-bigint"]
scheme-backend = ["python", "dep:gerbil-scheme", "dep:num-bigint", "pyo3/num-bigint"]
rust-backend = ["python"]
external-program = ["gerbil-scheme?/external-program"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
pyo3 = { workspace = true, optional = true }
gerbil-scheme = { workspace = true, optional = true }
num-bigint = { version = "0.4", optional = true }

[dev-dependencies]
asp-rust.workspace = true
libloading = "=0.8.9"

[lints]
workspace = true
