[workspace]
members = [
  "build-support/gerbil-scheme-aot-build",
  "build-support/gerbil-scheme-rust-project-harness-policy",
  "build-support/gerbil-scheme-rust-project-harness",
  "crates/gerbil-scheme",
  "crates/gerbil-scheme-qualification",
    "crates/gerbil-scheme-build",
    "crates/gerbil-scheme-sys",
  "crates/gerbil-scheme-python",
]
exclude = ["examples/python-ledger"]

resolver = "3"

[profile.dev]
opt-level = 2
debug = 2
debug-assertions = true
overflow-checks = true

[profile.release]
opt-level = 3
lto = "thin"
overflow-checks = true

[profile.dev.build-override]
opt-level = 2

[profile.release.build-override]
opt-level = 3

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["gerbil-scheme-rust contributors"]
license = "Apache-2.0 OR LGPL-2.1-or-later"
repository = "https://github.com/tao3k/gerbil-scheme-rust"

[workspace.dependencies]
asp-rust = { git = "https://github.com/tao3k/asp-rust", rev = "2419414ee5379bad89506496e3eaab928df68daf", version = "0.1.2", default-features = false }
cc = "1.2.64"
pkg-config = "0.3"
cbindgen = "0.29.4"
divan = "0.1.21"
simdutf8 = "0.1.5"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
gerbil-scheme-aot-build = { path = "build-support/gerbil-scheme-aot-build" }
gerbil-scheme-rust-project-harness-policy = { path = "build-support/gerbil-scheme-rust-project-harness-policy" }
gerbil-scheme-rust-project-harness = { path = "build-support/gerbil-scheme-rust-project-harness", version = "0.1.2" }
gerbil-scheme = { path = "crates/gerbil-scheme", version = "0.1.0" }
gerbil-scheme-sys = { path = "crates/gerbil-scheme-sys", version = "0.1.0" }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "3", features = ["full", "parsing"] }
pyo3 = { version = "=0.27.2", features = ["abi3-py310"] }
gerbil-scheme-python = { path = "crates/gerbil-scheme-python" }

[workspace.lints.rust]
missing_debug_implementations = "warn"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
