[package]
name = "gerbil-scheme"
description = "Safe Rust bindings for invoking Gerbil Scheme."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
gerbil-scheme-sys.workspace = true
simdutf8.workspace = true
libc = { version = "=0.2.186", optional = true }
tokio = { workspace = true, optional = true, features = ["time"] }

[features]
isolated-instances = ["dep:libc"]
tokio-dispatch = ["isolated-instances", "dep:tokio"]
external-program = ["gerbil-scheme-sys/external-program"]

[dev-dependencies]
divan.workspace = true
syn = { workspace = true, features = ["visit"] }
tokio.workspace = true
gerbil-scheme-rust-project-harness.workspace = true

[build-dependencies]
gerbil-scheme-rust-project-harness-policy.workspace = true

# Each runtime qualification owns a separate process: the native runtime is
# deliberately one-shot, so these cannot share unit_test's process.
[[test]]
name = "bytestring_benchmark"
path = "tests/unit/targets/bytestring_benchmark.rs"

[[test]]
name = "exact_integer"
path = "tests/unit/targets/exact_integer.rs"

[[test]]
name = "exact_integer_benchmark"
path = "tests/unit/targets/exact_integer_benchmark.rs"

[[test]]
name = "ffi_benchmark"
path = "tests/unit/targets/ffi_benchmark.rs"

[[test]]
name = "identity"
path = "tests/unit/targets/identity.rs"

[[test]]
name = "integer_bytes_benchmark"
path = "tests/unit/targets/integer_bytes_benchmark.rs"

[[test]]
name = "rooted_value"
path = "tests/unit/targets/rooted_value.rs"

[[test]]
name = "rooted_value_benchmark"
path = "tests/unit/targets/rooted_value_benchmark.rs"

[[test]]
name = "tokio_handoff"
path = "tests/unit/targets/tokio_handoff.rs"

[[test]]
name = "runtime_lifecycle"
path = "tests/unit/targets/runtime_lifecycle.rs"

[[test]]
name = "runtime_round_trip"
path = "tests/unit/targets/runtime_round_trip.rs"

[[bench]]
name = "ffi"
harness = false

[[bench]]
name = "tokio_transport"
harness = false

[[bench]]
name = "types"
harness = false

[[bench]]
name = "objects"
path = "benches/objects/main.rs"
harness = false

[lints]
workspace = true
