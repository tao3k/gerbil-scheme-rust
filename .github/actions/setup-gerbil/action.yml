name: Set up pinned Gerbil
description: Install the SDK's immutable Gerbil release and its host prerequisites

inputs:
  release-root:
    description: Directory where the Gerbil release is installed
    required: true

runs:
  using: composite
  steps:
    - name: Install Linux Gerbil prerequisites
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential jq pkg-config libssl-dev libsqlite3-dev zlib1g-dev

    - name: Install macOS Gerbil prerequisites
      if: runner.os == 'macOS'
      shell: bash
      env:
        HOMEBREW_NO_AUTO_UPDATE: '1'
        HOMEBREW_NO_INSTALL_CLEANUP: '1'
      run: |
        brew list --formula ghostscript >/dev/null 2>&1 && brew unlink ghostscript || true
        brew install gcc jq pkg-config openssl@3 sqlite zlib

    - name: Activate immutable Gerbil release
      shell: bash
      env:
        RELEASE_ROOT: ${{ inputs.release-root }}
        ACTION_ROOT: ${{ github.action_path }}
      run: |
        "$ACTION_ROOT/../../../tools/ci/install-gerbil-release.sh" "$RELEASE_ROOT"

    - name: Set Gerbil build controls
      shell: bash
      run: |
        test -x "$GERBIL_PREFIX/bin/gsc"
        cores="$(getconf _NPROCESSORS_ONLN 2>/dev/null || sysctl -n hw.ncpu)"
        {
          echo "GERBIL_GSC=$GERBIL_PREFIX/bin/gsc"
          echo "GERBIL_BUILD_CORES=$cores"
          if [[ "$(uname -s)" == Darwin ]]; then
            # Stable formula roots, not the Cellar version embedded in an SDK.
            echo "LIBRARY_PATH=$(brew --prefix openssl@3)/lib:$(brew --prefix sqlite)/lib:$(brew --prefix zlib)/lib${LIBRARY_PATH:+:$LIBRARY_PATH}"
          fi
        } >> "$GITHUB_ENV"
        "$GERBIL_PREFIX/bin/gsc" -v
