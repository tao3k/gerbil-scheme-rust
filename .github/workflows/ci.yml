name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bindings:
    name: Gerbil v0.19 bindings (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      GERBIL_RELEASE_ROOT: ${{ github.workspace }}/.ci/gerbil-v0.19
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy,rustfmt

      - name: Set up immutable Gerbil release
        uses: ./.github/actions/setup-gerbil
        with:
          release-root: ${{ env.GERBIL_RELEASE_ROOT }}

      - name: Configure Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          cache-save: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
          disk-cache: gerbil-v0.19-${{ runner.os }}-${{ runner.arch }}
          repository-cache: true

      - name: Cargo format
        run: cargo fmt --all --check

      - name: Check shell Gerbil environment boundary
        shell: bash
        run: |
          env CC=foreign SDKROOT=/nix/store/foreign GAMBOPT=selected \
            tools/gerbil-build-command.sh bash -c '
              test -z "${CC+x}" && test -z "${SDKROOT+x}" &&
              test "$GAMBOPT" = selected
            '

      - name: Cargo gates
        run: |
          cargo check --workspace --locked
          cargo test --workspace --locked -- --nocapture
          cargo bench -p gerbil-scheme --bench ffi --profile dev --locked -- --test
          cargo bench -p gerbil-scheme --bench tokio_transport --profile dev --locked -- --test
          cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Scheme actor capability
        run: gxi scheme/runtime-smp-test.ss

      - name: Full-program actor AOT qualification
        run: |
          cargo bench -p gerbil-scheme-qualification --features actor-aot --bench actors --profile dev --locked -- --test
          cargo clippy -p gerbil-scheme-qualification --features actor-aot --all-targets --locked -- -D warnings

      - name: Bazel gates
        run: |
          bazel query //...
          bazel build //...
          bazel test //:ci
