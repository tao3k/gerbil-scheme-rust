[package]
name = "gerbil-python-ledger"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR LGPL-2.1-or-later"
publish = false

[lib]
name = "_core"
crate-type = ["cdylib"]
test = false
doctest = false

[features]
default = ["rust-backend"]
extension-module = ["pyo3/extension-module"]
scheme-backend = ["dep:gerbil-scheme", "dep:gerbil-scheme-sys", "gerbil-scheme-python/scheme-backend", "gerbil-scheme-python/external-program"]
rust-backend = ["dep:gerbil-scheme", "gerbil-scheme-python/instance-backend", "gerbil-scheme-python/external-program"]

[dependencies]
gerbil-scheme = { path = "../../crates/gerbil-scheme", optional = true, features = ["external-program"] }
gerbil-scheme-sys = { path = "../../crates/gerbil-scheme-sys", optional = true, features = ["external-program"] }
gerbil-scheme-python = { path = "../../crates/gerbil-scheme-python" }
pyo3 = { version = "=0.27.2", features = ["abi3-py310"] }
num-bigint = { version = "0.4", optional = true }

[build-dependencies]
gerbil-scheme-aot-build = { path = "../../build-support/gerbil-scheme-aot-build" }
gerbil-scheme-python = { path = "../../crates/gerbil-scheme-python" }
serde_json = "1"

[dev-dependencies]
asp-rust = { git = "https://github.com/tao3k/asp-rust", rev = "1ca41124b846dec947f3d05119cafa07eaa57924", version = "0.1.2", default-features = false }

[workspace]
