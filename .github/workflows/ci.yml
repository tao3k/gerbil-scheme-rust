name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bindings:
    name: Gerbil v0.19 bindings (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      GERBIL_RELEASE_ROOT: ${{ github.workspace }}/.ci/gerbil-v0.19
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy,rustfmt

      - name: Set up immutable Gerbil release
        uses: ./.github/actions/setup-gerbil
        with:
          release-root: ${{ env.GERBIL_RELEASE_ROOT }}

      - name: Cargo format
        run: cargo fmt --all --check

      - name: Cargo gates
        env:
          GERBIL_SCHEME_RUST_CHECK_GENERATED_SCM: "1"
        run: |
          cargo check --workspace --locked
          cargo test --workspace --locked -- --nocapture
          cargo bench -p gerbil-scheme --bench ffi --profile dev --locked -- --test
          cargo bench -p gerbil-scheme --bench tokio_transport --profile dev --locked -- --test
          cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Record unsupported SMP qualification
        run: |
          echo '::notice::SKIPPED: Scheme multi-processor qualification requires multiple-threaded-vms, which the pinned Gerbil toolchain does not support. This is not an SMP pass.'
          echo '### Scheme SMP: SKIPPED (unsupported Gerbil toolchain capability; not passed)' >> "$GITHUB_STEP_SUMMARY"
          echo 'The pinned Gerbil toolchain supports multiple VMs but not multiple-threaded VMs. Single-processor actor AOT and both Rust concurrency controls remain required. Restore the separate SMP job after the Gerbil toolchain capability is qualified.' >> "$GITHUB_STEP_SUMMARY"

      - name: Single-processor actor AOT and Rust concurrency qualification
        if: runner.os != 'macOS'
        run: |
          cargo bench -p gerbil-scheme-qualification --features actor-aot --bench actors --profile dev --locked -- --test one_processor_control
          cargo bench -p gerbil-scheme-qualification --features actor-aot --bench actors --profile dev --locked -- --test tokio_one_worker_control
          cargo bench -p gerbil-scheme-qualification --features actor-aot --bench actors --profile dev --locked -- --test tokio_machine_workers
          cargo clippy -p gerbil-scheme-qualification --features actor-aot --all-targets --locked -- -D warnings

  # Compiler controls do not depend on workspace execution. Their separate
  # Cargo graph previously consumed six minutes of the same 30-minute budget.
  compiler-controls:
    name: Scheme compiler and metadata controls (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      GERBIL_RELEASE_ROOT: ${{ github.workspace }}/.ci/gerbil-v0.19
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy
      - name: Set up immutable Gerbil release
        uses: ./.github/actions/setup-gerbil
        with:
          release-root: ${{ env.GERBIL_RELEASE_ROOT }}
      - name: Scheme compiler output and diagnostic controls
        run: cargo test -p gerbil-scheme-aot-build --lib --locked
      - name: Paired Gambit GCC object identity
        if: runner.os == 'Linux'
        run: cargo test -p gerbil-scheme-aot-build --lib --locked actual_gambit_diagnostic_modes_preserve_object_bytes -- --ignored --exact program::process::process_tests::actual_gambit_diagnostic_modes_preserve_object_bytes --nocapture
      - name: Qualify opt-in compiler-owned metadata carriers
        run: |
          export GERBIL_PATH="$RUNNER_TEMP/metadata-package"
          export GERBIL_LOADPATH="$GERBIL_PATH/lib"
          gxi build.ss compile
          gxi scheme/runtime-test.ss
          gxi :gerbil-scheme-rust/scheme/build test "$PWD" t/actor-batch-test.ss 2>&1 | tee "$RUNNER_TEMP/actor-batch-test.log"
          rg --quiet '^CASE-OK ' "$RUNNER_TEMP/actor-batch-test.log"
          if rg --quiet 'ERROR|FAILED|FAILURE|FAIL:|Unhandled' "$RUNNER_TEMP/actor-batch-test.log"; then
            echo 'Actor coordinator failure escaped its caller' >&2
            exit 1
          fi
          gxi -e '(import (only-in :gerbil/tools/gxtest main)) (exit (main "-g" "-v" "5" "t/link-options-test.ss"))'
          gxi -:debug=q t/program-metadata-test.ss "$RUNNER_TEMP/metadata-qualification"
          gxi -:debug=q t/program-metadata-link-test.ss "$RUNNER_TEMP/metadata-link-qualification"
      - name: Arrow C Data native round trip
        run: |
          cargo test -p gerbil-scheme --features arrow --lib --locked runtime::arrow::
          cargo clippy -p gerbil-scheme --features arrow --lib --locked -- -D warnings
          cargo test -p gerbil-scheme-qualification --features arrow-aot --test linked_arrow --locked
          cargo clippy -p gerbil-scheme-qualification --features arrow-aot --test linked_arrow --locked -- -D warnings

  # Cargo and Bazel own independent build graphs. Keep both complete gates,
  # without spending Bazel's watchdog budget on Cargo compilation first.
  build-api:
    name: C ABI package tooling (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      GERBIL_RELEASE_ROOT: ${{ github.workspace }}/.ci/gerbil-v0.19
      GERBIL_SCHEME_RUST_CHECK_GENERATED_SCM: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy
      - name: Set up immutable Gerbil release
        uses: ./.github/actions/setup-gerbil
        with:
          release-root: ${{ env.GERBIL_RELEASE_ROOT }}
      - name: Direct build, clean, GxTest, cancellation and natural exit
        run: |
          cargo test -p gerbil-scheme-sys --lib --locked -- --nocapture
          cargo test -p gerbil-scheme --test runtime_lifecycle --test build --locked -- --nocapture

  # Lint and execution have independent Cargo request graphs. Keep both exact
  # checks; do not make one job prepare both complete images sequentially.
  build-api-lint:
    name: C ABI package tooling lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      GERBIL_RELEASE_ROOT: ${{ github.workspace }}/.ci/gerbil-v0.19
      GERBIL_SCHEME_RUST_CHECK_GENERATED_SCM: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy
      - name: Set up immutable Gerbil release
        uses: ./.github/actions/setup-gerbil
        with:
          release-root: ${{ env.GERBIL_RELEASE_ROOT }}
      - name: Check the exact default C ABI build targets
        run: |
          cargo clippy -p gerbil-scheme-sys --lib --tests --locked -- -D warnings
          cargo clippy -p gerbil-scheme --test runtime_lifecycle --test build --locked -- -D warnings

  bazel:
    name: Bazel bindings (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      GERBIL_RELEASE_ROOT: ${{ github.workspace }}/.ci/gerbil-v0.19
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Set up immutable Gerbil release
        uses: ./.github/actions/setup-gerbil
        with:
          release-root: ${{ env.GERBIL_RELEASE_ROOT }}
      - name: Configure Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          cache-save: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
          disk-cache: gerbil-v0.19-${{ runner.os }}-${{ runner.arch }}
          repository-cache: true
      - name: Bazel gates
        run: |
          bazel query //...
          bazel build //...
          bazel test //:ci

  # Real owner/TLS retirement has a separate native gate from the Quint model.
  # This Darwin image backend uses independent single-processor Scheme runtimes.
  native-owner:
    name: Fixed-owner Scheme/Rust lifecycle (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      GERBIL_RELEASE_ROOT: ${{ github.workspace }}/.ci/gerbil-v0.19
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy
      - name: Set up immutable Gerbil release
        uses: ./.github/actions/setup-gerbil
        with:
          release-root: ${{ env.GERBIL_RELEASE_ROOT }}
      - name: Scheme owner retirement and failure controls
        run: |
          cargo -vv bench -p gerbil-scheme-qualification --features instance-library --bench instance_resources --profile dev --locked -- --blocking-tls
          cargo bench -p gerbil-scheme-qualification --features instance-library --bench instance_resources --profile dev --locked -- --blocking-tls-drop
          cargo bench -p gerbil-scheme-qualification --features instance-library --bench instance_resources --profile dev --locked -- --callbacks
          cargo bench -p gerbil-scheme-qualification --features instance-library --bench instance_resources --profile dev --locked -- --finalizer-failure
          cargo bench -p gerbil-scheme-qualification --features instance-library --bench instance_resources --profile dev --locked -- --owner-unwind
          cargo bench -p gerbil-scheme-qualification --features instance-library --bench instance_resources --profile dev --locked -- --root-quarantine
          cargo bench -p gerbil-scheme-qualification --features instance-library --bench instance_resources --profile dev --locked -- --before
          cargo bench -p gerbil-scheme-qualification --features instance-library --bench instance_resources --profile dev --locked -- --after
          cargo bench -p gerbil-scheme-qualification --features instance-library --bench instance_resources --profile dev --locked -- --retained
          cargo bench -p gerbil-scheme-qualification --features instance-library --bench instance_resources --profile dev --locked -- --preflight
          cargo bench -p gerbil-scheme-qualification --features instance-library --bench instance_resources --profile dev --locked -- --mapping-release
          cargo bench -p gerbil-scheme-qualification --features instance-library --bench instance_resources --profile dev --locked -- --mapping-foreign-tls
          cargo bench -p gerbil-scheme-qualification --features instance-library --bench instance_resources --profile dev --locked -- --module-capture-failure
      - name: Cached timer provider and result construction contracts
        run: |
          cargo test -p gerbil-scheme-qualification --test owner_timer_cache --locked -- --nocapture
          cargo bench -p gerbil-scheme-qualification --features instance-dispatch,arrival-prebuilt --bench result_construction_contracts --profile dev --locked
      - name: Rust owner cost bench smoke
        run: cargo bench -p gerbil-scheme-qualification --features instance-library --bench owner_costs --profile dev --locked -- --test
      - name: Scheme runtime capabilities and reuse
        run: cargo bench -p gerbil-scheme-qualification --features arrival-clock --bench instance_resources --profile dev --locked -- --smoke
      - name: Verify owner retirement and fault recovery
        run: |
          cargo test -p gerbil-scheme --features arrival-clock --lib instances:: --locked
          cargo test -p gerbil-scheme --features tokio-dispatch --test unit_test instance_timer --locked -- --test-threads=12
          cargo test -p gerbil-scheme-qualification --features arrival-clock --test owner_capacity --test owner_dispatch_faults --test owner_producer --test scheme_service --test service_watchdog --locked

  owner-dispatch-smoke:
    name: Rust dispatcher benchmark smoke (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      GERBIL_RELEASE_ROOT: ${{ github.workspace }}/.ci/gerbil-v0.19
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Set up immutable Gerbil release
        uses: ./.github/actions/setup-gerbil
        with:
          release-root: ${{ env.GERBIL_RELEASE_ROOT }}
      - name: Rust dispatcher bench smoke
        run: |
          cargo bench -p gerbil-scheme-qualification --features arrival-clock --bench owner_dispatch --profile dev --locked -- --test --grouped-ab
          cargo bench -p gerbil-scheme-qualification --features arrival-clock --bench owner_dispatch --profile dev --locked -- --test --profile --grouped-ab
          cargo bench -p gerbil-scheme-qualification --features arrival-clock --bench owner_dispatch --profile dev --locked -- --test --focused-flow
          cargo bench -p gerbil-scheme-qualification --features arrival-clock --bench owner_capacity --profile dev --locked -- --test --wait-trace
          cargo bench -p gerbil-scheme-qualification --features arrival-clock --bench owner_capacity --profile dev --locked -- --test --transfer-ab
          cargo bench -p gerbil-scheme-qualification --features arrival-clock --bench owner_capacity --profile dev --locked -- --test --qos-ab --wait-trace
          cargo bench -p gerbil-scheme-qualification --features arrival-clock --bench scheme_service --profile dev --locked -- --test
          cargo bench -p gerbil-scheme-qualification --features arrival-clock --bench single_vm_service --profile dev --locked -- --test
          cargo bench -p gerbil-scheme-qualification --features arrival-clock --bench scheme_service --profile dev --locked -- --test --split-layout-ab
          cargo bench -p gerbil-scheme-qualification --features arrival-clock --bench scheme_service --profile dev --locked -- --test --short-layout-only
          cargo bench -p gerbil-scheme-qualification --features arrival-clock --bench scheme_service --profile dev --locked -- --test --class-route-ab
          cargo bench -p gerbil-scheme-qualification --features arrival-clock --bench scheme_service --profile dev --locked -- --test --short-service-ab
          cargo bench -p gerbil-scheme-qualification --features arrival-clock --bench scheme_service --profile dev --locked -- --test --feed-ab
          cargo bench -p gerbil-scheme-qualification --features arrival-clock --bench scheme_service --profile dev --locked -- --test --feed-ab --phase-observation
          cargo bench -p gerbil-scheme-qualification --features arrival-clock --bench scheme_service --profile dev --locked -- --test --budget-ab
          cargo bench -p gerbil-scheme-qualification --features arrival-clock --bench scheme_service --profile dev --locked -- --test --notification-ab
          cargo bench -p gerbil-scheme-qualification --features arrival-clock --bench scheme_service --profile dev --locked -- --test --reselection-ab
          cargo bench -p gerbil-scheme-qualification --features arrival-clock --bench scheme_service --profile dev --locked -- --test --owner-qos-ab
          cargo bench -p gerbil-scheme-qualification --features arrival-clock --bench scheme_service --profile dev --locked -- --test --resident-ab
          cargo bench -p gerbil-scheme-qualification --features arrival-clock --bench scheme_service --profile dev --locked -- --test --pooled-ab
          cargo bench -p gerbil-scheme-qualification --features arrival-clock --bench scheme_service --profile dev --locked -- --test --pooled-ab --probe-observation
          cargo bench -p gerbil-scheme-qualification --features arrival-clock --bench scheme_service --profile dev --locked -- --test --observer-ab
          cargo bench -p gerbil-scheme-qualification --features arrival-clock --bench scheme_service --profile dev --locked -- --test --observer-ab --entry-observation
          cargo bench -p gerbil-scheme-qualification --features arrival-clock --bench scheme_service --profile dev --locked -- --test --observer-ab --state-observation
          cargo bench -p gerbil-scheme-qualification --features arrival-clock --bench scheme_service --profile dev --locked -- --test --short-route-load-ab
          cargo bench -p gerbil-scheme-qualification --features arrival-clock --bench scheme_service --profile dev --locked -- --test --supply-admission-ab
          cargo bench -p gerbil-scheme-qualification --features arrival-clock --bench scheme_service --profile dev --locked -- --test --pooled-wake-ab
          cargo bench -p gerbil-scheme-qualification --features arrival-clock --bench scheme_service --profile dev --locked -- --test --pooled-ab --phase-observation
          cargo bench -p gerbil-scheme-qualification --features arrival-clock --bench scheme_service --profile dev --locked -- --test --notification-ab --phase-observation
          cargo bench -p gerbil-scheme-qualification --features arrival-clock --bench scheme_service --profile dev --locked -- --test --progress-fair-ab --fixed-short-selective --completion-service-ab

  owner-rust-lint:
    name: Owner Rust lint (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      GERBIL_RELEASE_ROOT: ${{ github.workspace }}/.ci/gerbil-v0.19
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy
      - name: Set up immutable Gerbil release
        uses: ./.github/actions/setup-gerbil
        with:
          release-root: ${{ env.GERBIL_RELEASE_ROOT }}
      - name: Scheme owner Rust lint
        run: |
          cargo clippy -p gerbil-scheme --features external-program,arrival-clock --lib --test unit_test --locked -- -D warnings
          cargo clippy -vv -p gerbil-scheme-qualification --features arrival-clock --bench instance_resources --bench owner_costs --bench owner_dispatch --bench owner_capacity --bench scheme_service --bench single_vm_service --bench gerbil_actor_arrival --test scheme_service --test service_watchdog --test owner_dispatch_faults --test owner_capacity --test owner_producer --locked -- -D warnings
          cargo clippy -vv -p gerbil-scheme-qualification --features actor-aot,arrival-clock --all-targets --locked -- -D warnings


  owner-actor:
    name: Single-processor Actor and Rust concurrency (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      GERBIL_RELEASE_ROOT: ${{ github.workspace }}/.ci/gerbil-v0.19
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy
      - name: Set up immutable Gerbil release
        uses: ./.github/actions/setup-gerbil
        with:
          release-root: ${{ env.GERBIL_RELEASE_ROOT }}
      - name: macOS single-processor Actor and Rust concurrency qualification
        run: |
          cargo bench -p gerbil-scheme-qualification --features actor-aot,arrival-clock --bench actors --profile dev --locked -- --test one_processor_control
          cargo bench -p gerbil-scheme-qualification --features actor-aot,arrival-clock --bench actors --profile dev --locked -- --test tokio_one_worker_control
          cargo bench -p gerbil-scheme-qualification --features actor-aot,arrival-clock --bench actors --profile dev --locked -- --test tokio_machine_workers

  # Explicitly skipped, not passed. Multiple VMs do not imply multi-processor
  # execution inside a VM. Restore this job only with a qualified Gerbil toolchain release.
  scheme-smp:
    name: Scheme SMP (SKIPPED - Gerbil toolchain lacks multiple-threaded-vms)
    if: ${{ false }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      GERBIL_RELEASE_ROOT: ${{ github.workspace }}/.ci/gerbil-v0.19
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: ./.github/actions/setup-gerbil
        with:
          release-root: ${{ env.GERBIL_RELEASE_ROOT }}
      - name: Require exact processor activation
        run: gxi scheme/runtime-smp-test.ss
      - name: Multi-processor actor AOT qualification
        run: cargo bench -p gerbil-scheme-qualification --features actor-aot --bench actors --profile dev --locked -- --test machine_processors

  owner-protocol:
    name: Owner lifecycle protocol (Quint shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    env:
      GERBIL_OWNER_MODEL_SHARD: ${{ matrix.shard }}
      QUINT_HOME: ${{ github.workspace }}/.ci/quint
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Install pinned Quint CLI
        run: npm install --global @informalsystems/quint@0.33.0
      - name: Prepare pinned Quint Rust evaluator
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download evaluator/v0.7.0 --repo quint-co/quint --pattern quint_evaluator-x86_64-unknown-linux-gnu.tar.gz --dir "$RUNNER_TEMP"
          printf '%s  %s\n' '869adb8762a518483eb39f67fde622253a58527494e15afe77d610a0b6dab7d2' "$RUNNER_TEMP/quint_evaluator-x86_64-unknown-linux-gnu.tar.gz" | sha256sum --check
          mkdir -p "$QUINT_HOME/rust-evaluator-v0.7.0"
          tar -xzf "$RUNNER_TEMP/quint_evaluator-x86_64-unknown-linux-gnu.tar.gz" -C "$QUINT_HOME/rust-evaluator-v0.7.0"
      - name: Check lifecycle scenarios, sampled traces and negative controls
        run: |
          quint typecheck specs/mailbox_result_construction.qnt
          quint test specs/mailbox_result_construction.qnt --main mailbox_result_construction --seed 1 --max-samples 1 --backend typescript
          cargo test -p gerbil-scheme-rust-project-harness --test integration_test owner_model::owner_protocol_scenarios_and_controls --locked -- --ignored --exact --nocapture
